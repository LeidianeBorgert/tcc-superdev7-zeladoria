<div class="list-container">
  
  <div class="filtros-container">
    <div class="grupo-filtros">
      
      <div class="campo-filtro">
        <label for="filtroBairro" class="label-filtro">Bairro</label>
        <input 
          id="filtroBairro"
          type="text" 
          placeholder="Ex: Centro" 
          class="input-filtro" 
          [(ngModel)]="filtroBairro" 
          (keyup.enter)="aplicarFiltros()" 
        />
      </div>

      <div class="campo-filtro">
        <label for="filtroRua" class="label-filtro">Rua</label>
        <input 
          id="filtroRua"
          type="text" 
          placeholder="Filtro por rua..." 
          class="input-filtro" 
          [(ngModel)]="filtroRua" 
          (keyup.enter)="aplicarFiltros()" 
        />
      </div>

      <div class="campo-filtro">
        <label for="filtroCategoria" class="label-filtro">Categoria</label>
        <select id="filtroCategoria" class="select-filtro" [(ngModel)]="filtroCategoria">
          <option value="">Filtro por ocorrido (Todas)</option>
          <option value="asfalto">Asfalto Danificado</option>
          <option value="buraco">Buraco na Via</option>
          <option value="calçada">Calçada Danificada / Obstáculo</option>
          <option value="lixo">Descarte de Lixo</option>
          <option value="iluminacao">Iluminação Pública</option>
          <option value="vazamento">Vazamento Água/Esgoto</option>
        </select>
      </div>

    </div>
    
    <div class="grupo-botoes-filtro">
      <button type="button" class="btn-cadastrar" (click)="aplicarFiltros()">Buscar</button>
      <button type="button" class="btn-limpar" (click)="limparFiltros()">Limpar</button>
    </div>
  </div>


  <div class="lista-cards">
    
    <div class="card-horizontal" *ngFor="let item of obterOcorrenciasPaginadas()" [ngClass]="obterClasseStatus(item.status)">

      <div class="col-esquerda">
        <span class="badge-categoria" [ngClass]="item.categoria">
          {{ formatarCategoria(item.categoria) }}
        </span>
        <div class="box-foto">
          <img  *ngIf="obterUrlFoto(item)"  [src]="obterUrlFoto(item)" alt="Foto da ocorrência" />
          
          <div *ngIf="!obterUrlFoto(item)" class="placeholder-icone">
            <span class="texto-sem-foto">Sem Foto</span>
          </div>
        </div>

        <span class="badge-tempo">{{ item.dataCriacao || '21/07/2026' }}</span>
      </div>

      <div class="col-meio">
        <h3 class="titulo-rua">{{ item.endereco || 'Buscando endereço...' }}</h3>
        <div class="box-descricao">
          <p>{{ item.descricao }}</p>
        </div>
      </div>

      <div class="col-direita">
        <div class="box-status">
          <label>Status / Visibilidade:</label>
          <select 
            [value]="item.status || 'Pendente'" 
            (change)="mudarStatus(item, $any($event.target).value)"
            class="select-status"
          >
            <option value="Pendente">Pendente</option>
            <option value="Em Andamento">Em Andamento</option>
            <option value="Resolvido">Concluído</option>  
          </select>
        </div>

        <button type="button" class="btn-visualizar" (click)="abrirNoMapa(item.latitude, item.longitude)">
          Ver Mais
        </button>
      </div>

    </div>

    <div *ngIf="ocorrenciasFiltradas.length === 0" style="text-align: center; padding: 40px; color: #64748b;">
      <p>Nenhuma ocorrência encontrada com esses filtros.</p>
    </div>

  </div>

  <div class="paginacao-container" *ngIf="ocorrenciasFiltradas.length > 0">
    <button 
      type="button" 
      class="btn-paginacao" 
      (click)="paginaAnterior()" 
      [disabled]="paginaAtual === 1">
      ← Anterior
    </button>

    <span class="texto-paginacao">
      Página <strong>{{ paginaAtual }}</strong> de <strong>{{ obterTotalPaginas() }}</strong>
    </span>

    <button 
      type="button" 
      class="btn-paginacao" 
      (click)="proximaPagina()" 
      [disabled]="paginaAtual === obterTotalPaginas()">
      Próximo →
    </button>
  </div>

</div>
