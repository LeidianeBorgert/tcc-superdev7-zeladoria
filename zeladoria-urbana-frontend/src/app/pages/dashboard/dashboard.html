<div class="dashboard-container">
  <h2 class="page-title">Painel de Monitoramento </h2>
  <p class="page-subtitle">Visão geral dos relatos e manutenções em Blumenau</p>

  <div class="dashboard-cards">
    <div class="card card-novos">
      <div class="card-value">{{ totalNovos }}</div>
      <div class="card-label">NOVOS RELATOS</div>
    </div>

    <div class="card card-andamento">
      <div class="card-value">{{ emAndamento }}</div>
      <div class="card-label">EM ANDAMENTO</div>
    </div>

    <div class="card card-resolvidos">
      <div class="card-value">{{ resolvidos }}</div>
      <div class="card-label">RESOLVIDOS</div>
    </div>
  </div>

  <div class="dashboard-grid">
    <div class="grafico-card">
      <div class="map-header">
        <h3 class="grafico-title">Mapa de Calor - Concentração</h3>
        <span class="map-subtitle">Áreas com maior incidência em Blumenau</span>
      </div>
      <div class="map-container-wrapper">
        <div id="heatmap" style="height: 440px; width: 100%;"></div>
      </div>
    </div>

    <div class="grafico-card">
      <h3 class="grafico-title">Ocorrências por Categoria</h3>
      <div class="canvas-container">
        <canvas #graficoPolar></canvas>
      </div>
    </div>
  </div>
</div>
