<div class="auth-container">
  <div class="auth-card">
    <h2>Acessar o Sistema</h2>
    <p class="auth-subtitle">Zeladoria Urbana - Blumenau</p>

    <div *ngIf="erroMensagem" class="alerta-erro">
      {{ erroMensagem }}
    </div>

    <form (ngSubmit)="fazerLogin()">
      <div class="campo-grupo">
        <label>E-mail</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="seu@email.com" required />
      </div>

      <div class="campo-grupo">
        <label>Senha</label>
        <input type="password" [(ngModel)]="senha" name="senha" placeholder="Sua senha" required />
      </div>

      <button type="submit" class="btn-entrar">Entrar</button>
    </form>

    <div class="auth-footer">
      <span>Ainda não tem conta?</span>
      <a routerLink="/cadastro">Cadastre-se</a>
    </div>
  </div>
</div>
