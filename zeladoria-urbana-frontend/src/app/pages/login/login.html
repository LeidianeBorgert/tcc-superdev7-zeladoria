<div class="auth-container">
  <div class="auth-card">
    <h2>Acessar o Sistema</h2>
    <p class="auth-subtitle">ZelaVerde - Blumenau</p>

    <div *ngIf="erroMensagem" class="alerta-erro">
      {{ erroMensagem }}
    </div>

    <form (ngSubmit)="fazerLogin()">
      <div class="campo-grupo">
        <label>E-mail</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="seu@email.com" required />
      </div>

      <div class="campo-grupo">
        <label>Senha</label>
        <div class="input-com-icone">
          <input 
            [type]="senhaVisivel ? 'text' : 'password'" 
            [(ngModel)]="senha" 
            name="senha" 
            placeholder="Sua senha" 
            required 
          />
          <i 
            [class]="senhaVisivel ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"
            (click)="alternarVisibilidadeSenha()"
          ></i>
        </div>
      </div>

      <button type="submit" class="btn-entrar">Entrar</button>
    </form>

    <div class="auth-footer">
      <span>Ainda não tem conta?</span>
      <a routerLink="/cadastro">Cadastre-se</a>
    </div>
  </div>
</div>
